name: build

on:
  push:
    branches: [master, main, "codex/qt6"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Build
        shell: cmd
        run: |
          cd build\qmake
          qmake sokit.pro > ..\..\build.log 2>&1
          if errorlevel 1 ( type ..\..\build.log & exit /b 1 )
          nmake >> ..\..\build.log 2>&1
          if errorlevel 1 ( type ..\..\build.log & exit /b 1 )

      - name: Report build log on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $msg = ((Get-Content build.log -Tail 30) -join "%0A")
            Write-Host "::error::$msg"
          }

      - name: Collect files
        shell: cmd
        run: |
          mkdir dist
          copy bin\win\sokit.exe dist\
          copy bin\win\sokit.lan dist\
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist\sokit.exe

      - uses: actions/upload-artifact@v4
        with:
          name: sokit-windows-x64
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6 and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-l10n-tools \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0
          # linuxdeploy looks for a plain "qmake"
          sudo ln -sf "$(command -v qmake6)" /usr/local/bin/qmake

      - name: Build
        run: |
          set -o pipefail
          cd build/qmake
          qmake6 sokit.pro 2>&1 | tee ../../build.log
          make -j"$(nproc)" 2>&1 | tee -a ../../build.log

      - name: Report build log on failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(tail -n 30 build.log | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
          fi

      - name: Package (plain tarball)
        run: |
          mkdir -p dist
          cp bin/linux/sokit dist/
          cp bin/linux/sokit.lan dist/
          tar -czf sokit-linux-x64.tar.gz -C dist .

      - name: Package (AppImage, all Qt libraries included)
        continue-on-error: true
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          curl -fsSL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/32x32/apps
          install -m755 bin/linux/sokit AppDir/usr/bin/sokit
          install -m644 bin/linux/sokit.lan AppDir/usr/bin/sokit.lan
          install -m644 build/linux86/sokit.desktop AppDir/usr/share/applications/sokit.desktop
          install -m644 src/sokit/sokit.png AppDir/usr/share/icons/hicolor/32x32/apps/sokit.png
          ./linuxdeploy.AppImage --appdir AppDir \
            -d build/linux86/sokit.desktop -i src/sokit/sokit.png \
            --plugin qt --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: sokit-linux-x64
          path: |
            sokit-linux-x64.tar.gz
            sokit-*.AppImage
          if-no-files-found: error

  macos:
    name: macOS (arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        run: |
          brew unlink qt@5 >/dev/null 2>&1 || true
          brew install qtbase qttools

      - name: Build app bundle (Qt libraries bundled, ad-hoc signed)
        run: |
          set -o pipefail
          bash -x ./build/macosx/build.sh 2>&1 | tee build.log

      - name: Report build log on failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg=$(tail -n 30 build.log | tr -d '\r' | awk '{printf "%s%%0A", $0}')
            echo "::error::$msg"
          fi

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent bin/macos/sokit.app sokit-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sokit-macos-arm64
          path: sokit-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Collect release files
        run: |
          set -e
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p out
          (cd incoming/sokit-windows-x64 && zip -qr "$GITHUB_WORKSPACE/out/sokit-${ver}-windows-x64.zip" .)
          for f in incoming/sokit-linux-x64/*; do
            case "$f" in
              *.AppImage) cp "$f" "out/sokit-${ver}-linux-x64.AppImage" ;;
              *.tar.gz)   cp "$f" "out/sokit-${ver}-linux-x64.tar.gz" ;;
            esac
          done
          cp incoming/sokit-macos-arm64/sokit-macos-arm64.zip "out/sokit-${ver}-macos-arm64.zip"
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          name: sokit ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
          body: |
            Cross platform builds of sokit, a TCP & UDP package
            send/receive/transfer tool.

            Downloads:
            * Windows x64: unzip and run `sokit.exe`, the Qt libraries are included
            * Linux x64: the `.AppImage`, `chmod +x` and run it, no installation needed
              (the `.tar.gz` is the bare executable plus the language file)
            * macOS arm64 (Apple Silicon): unzip and open `sokit.app`

            The macOS bundle is signed ad-hoc, not with an Apple developer
            certificate, so the first start may need a right click ->
            "Open".
